plugins { id 'com.android.application' }

// Node.js nhúng (nodejs-mobile): libnode/bin/<abi>/libnode.so và libnode/include/node/*.h, tải trong bước build (xem .github/workflows)
android {
    namespace 'vn.msao.app'
    compileSdk 34
    defaultConfig {
        applicationId 'vn.msao.app'
        minSdk 24
        targetSdk 34
        versionCode 110
        versionName '1.1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } // máy POS cũ thường là 32-bit
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { jniLibs.srcDirs = ['libnode/bin'] } }
    signingConfigs {
        // ponytail: khóa ký nằm trong repo riêng tư cho gọn; repo công khai thì chuyển sang GitHub Secrets
        release { storeFile file('msao-release.jks'); storePassword 'msao-ky-app'; keyAlias 'msao'; keyPassword 'msao-ky-app' }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
